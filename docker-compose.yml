services:
  db:
    image: postgres:15
    container_name: acrespay-db
    environment:
      POSTGRES_DB: acrespay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d acrespay"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - acrespay-db-data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acrespay-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      SESSION_SECRET: local-dev-secret-change-me
      SESSION_COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/acrespay
      DEV_USER_ID: dev-user
      DEV_USER_EMAIL: dev@example.com
      DEV_USER_FIRST_NAME: Dev
      DEV_USER_LAST_NAME: User
    command: sh -c "npm run db:push && npm start"
    ports:
      - "5000:5000"

volumes:
  acrespay-db-data:
